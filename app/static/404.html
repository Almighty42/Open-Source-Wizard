<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme) {
            document.documentElement.setAttribute("data-theme", theme);
          } else if (
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Open Source Wizard</title>
    <meta
      name="description"
      content="Open Source Wizard — electronics, embedded systems, and DIY hardware projects."
    />
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="error-page">
      <img
        class="error-page__logo"
        data-theme-image
        data-light-src="/static/assets/icons/logo.svg"
        data-dark-src="/static/assets/icons/logo_dark.svg"
        id="site-logo"
        src="/static/assets/icons/logo.svg"
        alt="Open Source Wizard Logo"
      />
      <h1>ERROR - 404</h1>
      <p>Page you were looking for does not exist.</p>
      <a href="/">Home Page</a>
    </div>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
