{% macro pagination_controls(pagination) %}
{% if pagination.pages > 1 %}
<div class="pagination">
	{% if pagination.has_prev %}
	<a class="pagination__button" href="{{ request.path }}?{{ request.args | replace('page', pagination.prev_num) }}">
		← Prev
	</a>
	{% else %}
	<span class="pagination__button pagination__button--disabled">← Prev</span>
	{% endif %}

	<span class="pagination__info">
		{{ pagination.page }} / {{ pagination.pages }}
	</span>

	{% if pagination.has_next %}
	<a class="pagination__button" href="{{ request.path }}?{{ request.args | replace('page', pagination.next_num) }}">
		Next →
	</a>
	{% else %}
	<span class="pagination__button pagination__button--disabled">Next →</span>
	{% endif %}
</div>
{% endif %}
{% endmacro %}
