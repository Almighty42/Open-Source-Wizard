<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
    (function() {
      var theme = localStorage.getItem("theme");
      if (theme) {
        document.documentElement.setAttribute("data-theme", theme);
      } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
        </script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% if title %}
            <title>{{ title }} — Open Source Wizard</title>
        {% else %}
            <title>Open Source Wizard</title>
        {% endif %}
        {% if description %}
            <meta name="description" content="{{ description }}">
        {% else %}
            <meta name="description"
                  content="Open Source Wizard — electronics, embedded systems, and DIY hardware projects.">
        {% endif %}
        <meta property="og:title"
              content="{% block og_title %}Open Source Wizard{% endblock %}">
        <meta property="og:description"
              content="{% block og_description %}Electronics, embedded systems and DIY hardware projects.{% endblock %}">
        <meta property="og:type" content="{% block og_type %}website{% endblock %}">
        <meta property="og:url" content="{{ request.url }}">
        <meta property="og:image" content="{% block og_image %}{% endblock %}">
        {% block extra_head %}{% endblock %}
        <link rel="icon"
              href="{{ url_for('static', filename='favicon.ico') }}"
              sizes="any">
        <link rel="preload"
              as="image"
              href="{{ url_for('static', filename='assets/icons/logo.svg') }}">
        <link rel="preload"
              as="image"
              href="{{ url_for('static', filename='assets/icons/logo_dark.svg') }}">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/app.css') }}" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap"
              rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css"
              rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
    </head>
    <body>
        {% block content %}{% endblock %}
        <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
    </body>
</html>
