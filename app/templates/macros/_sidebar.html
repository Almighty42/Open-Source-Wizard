{% macro sidebar(headings) %}
<div class="sidebar">
  <ul role="list" class="sidebar__list">
    {% for h in headings %}
      <li class="sidebar__item">
        <a class="sidebar__anchor" href="#{{ h.id }}">{{ h.text }}</a>
        {% if h.children %}
          <ul role="list" class="sidebar__sublist">
            {% for c in h.children %}
              <li class="sidebar__item sidebar__item--child">
                <a class="sidebar__anchor" href="#{{ c.id }}">{{ c.text }}</a>
              </li>
            {% endfor %}
          </ul>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</div>
{% endmacro %}
