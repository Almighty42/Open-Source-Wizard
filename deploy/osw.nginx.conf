server {
    listen 80;
    listen [::]:80;
    server_name opensourcewizard.com www.opensourcewizard.com;
    return 301 https://opensourcewizard.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name opensourcewizard.com www.opensourcewizard.com;

    ssl_certificate     /etc/ssl/osw/origin.pem;
    ssl_certificate_key /etc/ssl/osw/origin.key;

    client_max_body_size 50M;

    location /static/ {
        alias /srv/osw/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
